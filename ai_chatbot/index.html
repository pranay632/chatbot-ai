<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Coding Helper Chatbot (Demo)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    textarea { width: 100%; height: 220px; }
    #output { white-space: pre; background:#f6f8fa; padding:10px; border-radius:6px; margin-top:10px }
  </style>
</head>
<body>
  <h1>AI Coding Helper Chatbot — Demo</h1>
  <p>Select language, paste code, then click <strong>Analyze</strong>.</p>
  <label for="language">Language:</label>
  <select id="language">
    <option>Python</option>
    <option>JavaScript</option>
    <option>Java</option>
    <option>C</option>
    <option>C++</option>
  </select>
  <button onclick="insertExample()">Insert Example</button>
  <br><br>
  <textarea id="code" placeholder="Paste your code here..."></textarea>
  <br>
  <button onclick="analyzeCode()">Analyze</button>
  <h3>Output</h3>
  <div id="output">(Results will appear here)</div>
  <script src="/static/main.js"></script>
</body>
</html>
